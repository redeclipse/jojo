setshader glowdecal
setshaderparam "glowcolor" 0.500000 0.200000 0.200000
texture decal "jojo/interface01.png"
texture g "jojo/interface01.png"

croplist = [
    0 0 128 128
    0 128 128 128
    0 256 128 256
    128 0 128 384
    128 384 128 128
    256 0 256 256
    256 128 128 128
    256 256 128 128
    256 384 128 128
    384 256 128 128
    384 384 128 128
]

loop i (div (listlen $croplist) 4) [
    x1 = (at $croplist (mul $i 4))
    y1 = (at $croplist (+ (mul $i 4) 1))
    x2 = (at $croplist (+ (mul $i 4) 2))
    y2 = (at $croplist (+ (mul $i 4) 3))
    setshader glowdecal
    setshaderparam "glowcolor" 1.0 1.0 1.0
    texture decal (format "<crop:%1,%2,%3,%4>jojo/interface01.png" $x1 $y1 $x2 $y2)
    texture g     (format "<crop:%1,%2,%3,%4>jojo/interface01.png" $x1 $y1 $x2 $y2)
]
